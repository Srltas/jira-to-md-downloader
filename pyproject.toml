[project]
name = "jira-to-md-downloader"
version = "0.1.0"
description = "Download Jira issues from jira.cubrid.org as local Markdown files."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
jira-to-md-download = "jira_to_md_downloader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_to_md_downloader"]
